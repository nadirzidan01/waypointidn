         :root {
            --primary: #0b3d5c;
            --primary-mid: #1565a0;
            --dark: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
            --radius: 14px;
        }
        
        * {
            box-sizing: border-box;
        }
        
        .changa-one-regular {
            font-family: "Changa One", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        
        .changa-one-regular-italic {
            font-family: "Changa One", sans-serif;
            font-weight: 400;
            font-style: italic;
        }
        
        body {
            font-family: 'Changa One', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(180deg, rgba(11, 61, 92, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%), url('bclara.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--dark);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* NAVBAR TOP FULL SAMPAI UJUNG */
        
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 24px;
            /* Padding samping dikecilkan agar membentang ujung ke ujung */
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .brand-logo {
            height: 68px;
            width: auto;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-link-item {
            text-decoration: none;
            color: var(--dark);
            font-weight: 400;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.25s ease;
        }
        
        .nav-link-item:hover {
            color: var(--primary);
            background: rgba(15, 98, 160, 0.08);
        }
        
        .nav-link-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
            color: #ffffff;
        }
        
        .cart-badge-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: 400;
            font-size: 13px;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
        }
        
        .container {
            max-width: 1100px;
            width: 100%;
            margin: 30px auto 40px;
            padding: 0 20px;
        }
        /* TULISAN CATALOG MENU JADI WARNA PUTIH */
        
        .catalog-title {
            text-align: center;
            color: #ffffff !important;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }
        
        .category-wrapper {
            margin-bottom: 28px;
            background: #ffffff;
            padding: 8px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }
        
        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            justify-content: center;
        }
        
        .cat-btn {
            background: transparent;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        
        .cat-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }
        
        .menu-item {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
        }
        
        .menu-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        
        .menu-info {
            padding: 14px;
        }
        
        .menu-info h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #0f172a;
        }
        
        .btn-tambah {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: 400;
            transition: background 0.2s ease;
        }
        
        .btn-tambah:hover {
            background: var(--primary-mid);
        }
        
        .footer-banner {
            background-color: var(--footer-bg);
            color: #f8fafc;
            padding: 24px 5%;
            margin-top: 50px;
        }
        
        .footer-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .footer-col {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .footer-divider {
            width: 1px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .footer-brand {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
        }
        
        .footer-section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .footer-address-text {
            font-size: 13px;
            color: #e2e8f0;
            margin: 0;
            line-height: 1.4;
        }
        /* LOGO WHATSAPP */
        
        .wa-link-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background-color: #25d366;
            border-radius: 50%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            text-decoration: none;
        }
        
        .wa-link-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.5);
            background-color: #20ba5a;
        }
        
        .wa-link-icon svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }
        
        .footer-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            font-size: 12px;
            color: #94a3b8;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .footer-links {
            display: flex;
            gap: 16px;
        }
        
        .footer-links a {
            color: #cbd5e1;
            text-decoration: none;
        }
        
        .footer-links a:hover {
            color: #ffffff;
        }
        
        @media (max-width: 680px) {
            .top-navbar {
                flex-wrap: wrap;
                justify-content: space-between;
                padding: 12px 16px;
            }
            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 8px;
            }
            .category-nav {
                justify-content: flex-start;
            }
        }
    </style>
</head>

            hargaUSD: 2.50,
            kategori: "souvenir",
            gambar: "mug.png"
        }, {
            nama: "Tumbler Stainless Steel",
            hargaIDR: 135000,
            hargaUSD: 7.50,
            kategori: "souvenir",
            gambar: "tumb.png"
        }];

        let keranjang = JSON.parse(localStorage.getItem('waypoint_cart')) || [];

        function updateCartCount() {
            const totalQty = keranjang.reduce((sum, item) => sum + (item.qty || 1), 0);
            document.getElementById('nav-cart-count').textContent = totalQty;
        }

        function renderMenu(kategori) {
            const container = document.getElementById('menu-list');
            container.innerHTML = '';

            databaseMenu.forEach(item => {
                if (item.kategori.toLowerCase() === kategori.toLowerCase()) {
                    container.innerHTML += `
                <div class="menu-item">
                    <img src="${item.gambar}" class="menu-img" alt="${item.nama}">
                    <div class="menu-info">
                        <h3>${item.nama}</h3>
                        <p style="color: var(--primary); font-weight:400; margin:0;">Rp ${item.hargaIDR.toLocaleString('id-ID')} ($${item.hargaUSD.toFixed(2)})</p>
                    </div>
                    <button class="btn-tambah" onclick="tambahKeKeranjang('${item.nama}', ${item.hargaIDR}, ${item.hargaUSD})">+ Add to Cart</button>
                </div>
            `;
                }
            });
        }

        function filterMenu(kategori, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu(kategori);
        }

        function tambahKeKeranjang(namaItem, hargaIDR, hargaUSD) {
            const existingIndex = keranjang.findIndex(item => item.namaItem === namaItem);

            if (existingIndex > -1) {
                keranjang[existingIndex].qty += 1;
            } else {
                keranjang.push({
                    namaItem,
                    hargaIDR,
                    hargaUSD,
                    qty: 1
                });
            }

            localStorage.setItem('waypoint_cart', JSON.stringify(keranjang));
            updateCartCount();
            alert(`${namaItem} added to cart!`);
        }

        updateCartCount();
        renderMenu('fastfood');
    </script>
</body>

</html>
